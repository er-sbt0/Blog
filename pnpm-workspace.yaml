packages:
  - 'packages/*'

allowBuilds:
  # The Electron shell (packages/desktop). Both of these do real work in a
  # postinstall and are silently broken without it: electron downloads its
  # binary, and @embedded-postgres/linux-x64 recreates the 14 symlinks in
  # native/lib/ that npm tarballs cannot carry. Without those the cluster dies
  # at launch with `error while loading shared libraries: libicui18n.so.60`
  # (docs/plans/desktop-app.md §10.3).
  '@embedded-postgres/linux-x64': true
  electron: true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  # A Windows-only dependency of electron-builder. The desktop build targets
  # Linux only (docs/plans/desktop-app.md §1, §8 phase 6), so its postinstall —
  # which fetches a Squirrel.Windows toolchain — is refused rather than run.
  electron-winstaller: false
  # The PTY behind the in-app terminal (docs/plans/in-app-terminal.md §4.2).
  # node-gyp in a postinstall, and then rebuilt against Electron's ABI by
  # `pnpm --filter @blog/desktop rebuild:native` — the Node-ABI copy this
  # build produces is not the one the main process can load.
  node-pty: true

minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1110.0'
  - '@aws-sdk/s3-request-presigner@3.1110.0'
